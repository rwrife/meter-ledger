name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: meter-ledger-windows-portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    container:
      image: gmeligio/flutter-android:3.47.7
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK and build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/home/flutter/sdks/flutter/bin:/home/flutter/sdks/flutter/bin/cache/dart-sdk/bin:$PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          flutter --version
          flutter pub get --enforce-lockfile
          flutter build apk --debug
